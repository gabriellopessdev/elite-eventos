name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://elite:elite@localhost:5432/elite_eventos
      JWT_SECRET: test-jwt-secret-elite-eventos
      JWT_TTL: 15m
      JWT_REFRESH_TTL: 7d
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elite
          POSTGRES_PASSWORD: elite
          POSTGRES_DB: elite_eventos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elite -d elite_eventos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
